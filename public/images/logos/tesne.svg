<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="tesneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#tesneBg)"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  
  <!-- Green leaf on top right of the logo, just like on the user's poster -->
  <path d="M125,58 C145,50 162,56 168,72 C168,88 152,94 135,90 C130,80 126,68 125,58 Z" fill="url(#leafGrad)" stroke="#14532d" stroke-width="3"/>
  <path d="M132,66 Q146,75 160,78" fill="none" stroke="#15803d" stroke-width="2"/>
  
  <!-- Ice cubes / droplets -->
  <rect x="36" y="52" width="14" height="14" rx="3" fill="#ffffff" opacity="0.6" transform="rotate(15 43 59)"/>
  <rect x="150" y="112" width="12" height="12" rx="2.5" fill="#ffffff" opacity="0.6" transform="rotate(-20 156 118)"/>
  <circle cx="50" cy="125" r="4" fill="#ffffff" opacity="0.7"/>
  <circle cx="155" cy="46" r="3" fill="#ffffff" opacity="0.7"/>

  <!-- Bold stylized TEŞNE lettering -->
  <g transform="translate(100, 114) skewX(-8)">
    <text x="0" y="0" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="38" fill="#14532d" stroke="#14532d" stroke-width="8" stroke-linejoin="round">TEŞNE</text>
    <text x="0" y="0" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="38" fill="#ffffff">TEŞNE</text>
  </g>

  <!-- Tagline pill: IÝENIŇI SIŇDIRÝÄR -->
  <rect x="25" y="146" width="150" height="26" rx="13" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="100" y="163" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="10" fill="#14532d" letter-spacing="1">IÝENIŇI SIŇDIRÝÄR</text>
</svg>