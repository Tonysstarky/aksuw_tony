<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bgCola" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b91c1c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="colaLiquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="35%" stop-color="#78350f"/>
      <stop offset="70%" stop-color="#291205"/>
      <stop offset="100%" stop-color="#1c0a02"/>
    </linearGradient>
    <linearGradient id="colaRedLabel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgCola)"/>
  <g transform="translate(145, 25)">
    <rect x="38" y="10" width="34" height="24" rx="4" fill="#dc2626" stroke="#fca5a5" stroke-width="1.5"/>
    <rect x="35" y="34" width="40" height="6" rx="2" fill="#dc2626"/>
    <!-- Bottle 1.0L with dark sparkling cola liquid -->
    <path d="M40,40 L40,75 Q40,110 5,145 L5,320 Q5,340 55,340 Q105,340 105,320 L105,145 Q70,110 70,75 L70,40 Z" fill="url(#colaLiquid)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <!-- Sparkling effervescence -->
    <circle cx="30" cy="180" r="3" fill="#f59e0b" opacity="0.6"/>
    <circle cx="75" cy="210" r="4" fill="#fbbf24" opacity="0.6"/>
    <circle cx="45" cy="270" r="3" fill="#f59e0b" opacity="0.5"/>
    <!-- Red Label -->
    <rect x="6" y="165" width="98" height="110" rx="8" fill="url(#colaRedLabel)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="55" y="205" text-anchor="middle" font-family="'Impact', Arial, sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="1">KOLA</text>
    <text x="55" y="226" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="14" fill="#fde047" letter-spacing="1.5">ÇYNAR</text>
    <text x="55" y="242" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="7.5" fill="#fef2f2" letter-spacing="1">ORIGINAL TASTE</text>
    <rect x="40" y="250" width="30" height="13" rx="6.5" fill="#ffffff"/>
    <text x="55" y="260" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="8.5" fill="#991b1b">1.0 L</text>
    <!-- Highlight shine -->
    <path d="M15,115 L15,325" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
  </g>
</svg>