<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bgRB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silverCan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="rbBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgRB)"/>
  <!-- 250ml Slim Can -->
  <g transform="translate(155, 45)">
    <!-- Silver Top -->
    <ellipse cx="45" cy="20" rx="42" ry="12" fill="url(#silverCan)" stroke="#cbd5e1" stroke-width="1.5"/>
    <ellipse cx="45" cy="19" rx="35" ry="8" fill="#64748b"/>
    <rect x="40" y="14" width="10" height="7" rx="2" fill="#cbd5e1"/>
    <!-- Slim Can Body -->
    <path d="M5,20 L5,270 Q5,285 45,285 Q85,285 85,270 L85,20 Z" fill="url(#silverCan)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <!-- Classic Quad Design: Top-right and Bottom-left Blue Quadrants -->
    <polygon points="45,20 85,20 85,150 45,150" fill="url(#rbBlue)"/>
    <polygon points="5,150 45,150 45,275 5,275" fill="url(#rbBlue)"/>
    <!-- Golden Sun in center -->
    <circle cx="45" cy="150" r="22" fill="#facc15"/>
    <!-- Left red bull silhouette -->
    <path d="M18,155 Q26,140 38,146 Q41,148 42,150 L40,153 Q34,151 28,154 Z" fill="#dc2626"/>
    <!-- Right red bull silhouette -->
    <path d="M72,155 Q64,140 52,146 Q49,148 48,150 L50,153 Q56,151 62,154 Z" fill="#dc2626"/>
    <!-- Text -->
    <text x="45" y="85" text-anchor="middle" font-family="'Impact', Arial, sans-serif" font-weight="900" font-size="18" fill="#1e3a8a" letter-spacing="1">Red Bull</text>
    <text x="45" y="100" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="7" fill="#dc2626" letter-spacing="1">ENERGY DRINK</text>
    <text x="45" y="210" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="7" fill="#ffffff" letter-spacing="0.5">Vitalizes body &amp; mind</text>
    <rect x="30" y="245" width="30" height="13" rx="6.5" fill="#1e3a8a"/>
    <text x="45" y="254" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="7.5" fill="#ffffff">250 ml</text>
    <!-- Highlight shine -->
    <rect x="14" y="24" width="7" height="250" rx="3.5" fill="#ffffff" opacity="0.35"/>
  </g>
</svg>