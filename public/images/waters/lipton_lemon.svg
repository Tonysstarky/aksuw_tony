<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bgLip" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teaLiquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgLip)"/>
  <g transform="translate(155, 30)">
    <!-- Yellow Cap -->
    <rect x="34" y="10" width="26" height="20" rx="3" fill="#eab308" stroke="#fef08a" stroke-width="1.5"/>
    <rect x="31" y="30" width="32" height="6" rx="2" fill="#ca8a04"/>
    <!-- Bottle Shape -->
    <path d="M35,36 L35,68 Q35,95 10,125 L10,285 Q10,300 47,300 Q84,300 84,285 L84,125 Q59,95 59,68 L59,36 Z" fill="url(#teaLiquid)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <!-- Lipton Yellow & Red Label -->
    <rect x="11" y="150" width="72" height="80" rx="6" fill="#facc15" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Red Lipton shield -->
    <ellipse cx="47" cy="175" rx="26" ry="14" fill="#dc2626"/>
    <text x="47" y="179" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="11" fill="#ffffff">Lipton</text>
    <!-- Lemon Slice Illustration -->
    <circle cx="47" cy="204" r="11" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="47" cy="204" r="8" fill="#eab308"/>
    <text x="47" y="222" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="7.5" fill="#713f12">ICE TEA • LEMON</text>
    <!-- Highlight shine -->
    <path d="M18,95 L18,290" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
  </g>
</svg>