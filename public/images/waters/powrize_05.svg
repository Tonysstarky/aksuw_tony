<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="powBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#93c5fd" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="75%" stop-color="#3b82f6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="powWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="powLabel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#020617" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgGlow)"/>
  <!-- Bottle Group with shadow -->
  <g filter="url(#dropShadow)">
    <!-- Cap -->
    <rect x="184" y="32" width="32" height="24" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="184" y1="40" x2="216" y2="40" stroke="#0369a1" stroke-width="1.5"/>
    <line x1="184" y1="46" x2="216" y2="46" stroke="#0369a1" stroke-width="1.5"/>
    <rect x="181" y="56" width="38" height="6" rx="2" fill="#0284c7"/>
    <!-- Neck -->
    <path d="M186,62 L186,90 Q186,115 155,145 L155,340 Q155,355 170,360 L230,360 Q245,355 245,340 L245,145 Q214,115 214,90 L214,62 Z" fill="url(#powBottle)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <!-- Water level bubbles -->
    <circle cx="175" cy="200" r="4" fill="#ffffff" opacity="0.6"/>
    <circle cx="225" cy="240" r="3" fill="#ffffff" opacity="0.5"/>
    <circle cx="180" cy="280" r="5" fill="#ffffff" opacity="0.7"/>
    <circle cx="215" cy="180" r="3.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="195" cy="310" r="4" fill="#ffffff" opacity="0.5"/>
    <!-- Label -->
    <rect x="156" y="175" width="88" height="110" rx="8" fill="url(#powLabel)" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="160" y="179" width="80" height="102" rx="6" fill="none" stroke="#7dd3fc" stroke-width="1"/>
    <!-- Mountains on label -->
    <polygon points="200,192 216,215 184,215" fill="#ffffff"/>
    <polygon points="185,200 197,215 173,215" fill="#bae6fd"/>
    <polygon points="215,200 227,215 203,215" fill="#bae6fd"/>
    <!-- Text on label -->
    <text x="200" y="235" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="1">PÖWRIZE</text>
    <text x="200" y="248" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="8" fill="#e0f2fe" letter-spacing="1">GAZLANDYRYLAN</text>
    <text x="200" y="260" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="8" fill="#facc15">ARÇALYK</text>
    <rect x="186" y="266" width="28" height="12" rx="6" fill="#ffffff"/>
    <text x="200" y="275" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="8" fill="#0369a1">0.5 L</text>
    <!-- Highlight shine -->
    <path d="M164,120 L164,345" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>