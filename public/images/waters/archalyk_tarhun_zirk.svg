<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bgTarhun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tarhunLiquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#6ee7b7" stop-opacity="0.75"/>
      <stop offset="85%" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="tarhunLabel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="shadowTarhun" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#020820" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgTarhun)"/>
  <ellipse cx="200" cy="365" rx="75" ry="12" fill="#10b981" opacity="0.35"/>

  <g filter="url(#shadowTarhun)">
    <!-- Cap -->
    <rect x="184" y="45" width="32" height="24" rx="4" fill="#059669" stroke="#6ee7b7" stroke-width="1.5"/>
    <rect x="181" y="69" width="38" height="6" rx="2" fill="#047857"/>

    <!-- Bottle with Emerald Tarhun Soda -->
    <path d="M186,75 L186,105 
             Q186,128 156,155 
             L156,340 
             Q156,356 172,360 
             L228,360 
             Q244,356 244,340 
             L244,155 
             Q214,128 214,105 
             L214,75 Z" 
          fill="url(#tarhunLiquid)" stroke="rgba(255,255,255,0.85)" stroke-width="2.5"/>

    <!-- Bubbles inside -->
    <circle cx="172" cy="180" r="3.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="228" cy="210" r="4" fill="#ffffff" opacity="0.7"/>
    <circle cx="178" cy="310" r="5" fill="#ffffff" opacity="0.8"/>
    <circle cx="220" cy="330" r="3" fill="#ffffff" opacity="0.6"/>

    <!-- Label -->
    <rect x="156" y="185" width="88" height="112" rx="10" fill="url(#tarhunLabel)" stroke="#ffffff" stroke-width="2"/>

    <!-- Brand Header -->
    <text x="200" y="204" text-anchor="middle" font-family="'Segoe UI', 'Montserrat', Arial, sans-serif" font-weight="900" font-size="13" fill="#ffffff" letter-spacing="1.2">ARÇALYK</text>

    <!-- Tarhun sprig & Zirk berries -->
    <path d="M190,236 Q198,222 200,212" stroke="#ffffff" stroke-width="2" fill="none"/>
    <ellipse cx="193" cy="222" rx="6" ry="2.5" fill="#34d399" transform="rotate(-30 193 222)"/>
    <ellipse cx="204" cy="225" rx="6" ry="2.5" fill="#34d399" transform="rotate(30 204 225)"/>

    <!-- Red Barberries (Zirk) -->
    <circle cx="212" cy="235" r="4.5" fill="#ef4444" stroke="#ffffff" stroke-width="0.8"/>
    <circle cx="218" cy="239" r="4" fill="#dc2626" stroke="#ffffff" stroke-width="0.8"/>

    <!-- Title on Label -->
    <text x="200" y="258" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="11" fill="#fef08a" letter-spacing="0.8">TARHUN &amp; ZIRK</text>
    <text x="200" y="270" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="7" fill="#ffffff" letter-spacing="0.6">MIWELI LIMONAD</text>

    <!-- Volume Badge -->
    <rect x="184" y="276" width="32" height="14" rx="7" fill="#ffffff"/>
    <text x="200" y="286" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="8.5" fill="#047857">0.5 L</text>

    <!-- Highlight -->
    <path d="M165,130 L165,345" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
  </g>
</svg>